name: ADTC Benchmark

on:
  workflow_dispatch:
    inputs:
      model_repo:
        description: "Hugging Face repo holding the GGUF"
        required: false
        default: "unsloth/Qwen3.5-4B-GGUF"
      model_file:
        description: "GGUF file name"
        required: false
        default: "Qwen3.5-4B-Q5_K_M.gguf"
      context_length:
        description: "Context length (tokens)"
        required: false
        default: "2048"
      threads:
        description: "CPU threads (laptop profile = 4 vCPU)"
        required: false
        default: "4"
      max_tokens:
        description: "Max tokens per answer"
        required: false
        default: "768"

permissions:
  contents: write

env:
  LLAMA_CPP_TAG: b10217
  MODEL_REPO: ${{ github.event.inputs.model_repo || 'unsloth/Qwen3.5-4B-GGUF' }}
  MODEL_FILE: ${{ github.event.inputs.model_file || 'Qwen3.5-4B-Q5_K_M.gguf' }}
  CTX_SIZE: ${{ github.event.inputs.context_length || '2048' }}
  THREADS: ${{ github.event.inputs.threads || '4' }}
  MAX_TOKENS: ${{ github.event.inputs.max_tokens || '768' }}
  LLAMA_BENCH: llama-cpp/llama-bench

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ubuntu:22.04
      options: "--cpus=4 --memory=8g --memory-swap=8g"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install base tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates libgomp1 python3

      - name: Free disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/lib/julia || true
          df -h /

      - name: Cache llama.cpp binaries
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: llama-cpp
          key: llama-${{ env.LLAMA_CPP_TAG }}-ubuntu-x64

      - name: Download llama.cpp binaries
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          curl -L --fail -o llama.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/${{ env.LLAMA_CPP_TAG }}/llama-${{ env.LLAMA_CPP_TAG }}-bin-ubuntu-x64.tar.gz"
          mkdir -p llama-cpp
          tar xzf llama.tar.gz -C llama-cpp --strip-components=1
          rm llama.tar.gz
          chmod +x llama-cpp/llama-server llama-cpp/llama-bench
          echo "llama-server version:"
          ./llama-cpp/llama-server --version || true

      - name: Cache GGUF model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/${{ env.MODEL_FILE }}
          key: gguf-${{ env.MODEL_REPO }}-${{ env.MODEL_FILE }}

      - name: Download model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -L --fail --progress-bar \
            -o "models/${{ env.MODEL_FILE }}" \
            "https://huggingface.co/${{ env.MODEL_REPO }}/resolve/main/${{ env.MODEL_FILE }}"

      - name: Capture system metadata
        id: sysmeta
        run: |
          echo "vcpus=$(nproc)" >> "$GITHUB_OUTPUT"
          echo "ram_mb=$(awk '/^MemTotal/ {print $2}' /proc/meminfo)" >> "$GITHUB_OUTPUT"
          echo "mem_limit_mb=$(( $(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo 8589934592) / 1024 / 1024 ))" >> "$GITHUB_OUTPUT"
          echo "cpu_model=$(lscpu | awk -F: '/Model name/ {gsub(/^[ \t]+/, "", $2); print $2}')" >> "$GITHUB_OUTPUT"
          lscpu | tee /tmp/lscpu.txt
          uname -a | tee /tmp/uname.txt
          echo "model_file_bytes=$(stat -c%s "models/${{ env.MODEL_FILE }}")" >> "$GITHUB_OUTPUT"

      - name: Run llama-bench Config A (phone-parity)
        run: |
          mkdir -p bench-results
          THREADS="${{ env.THREADS }}" bash benchmarks/adtc/scripts/run_bench.sh \
            "models/${{ env.MODEL_FILE }}" A "bench-results/configA.json"

      - name: Run llama-bench Config B (submission-intended)
        run: |
          THREADS="${{ env.THREADS }}" bash benchmarks/adtc/scripts/run_bench.sh \
            "models/${{ env.MODEL_FILE }}" B "bench-results/configB.json"

      - name: Run TTFT / reasoning benchmark (llama-server)
        run: |
          python3 benchmarks/adtc/scripts/benchmark_llm.py \
            --model "models/${{ env.MODEL_FILE }}" \
            --server-bin llama-cpp/llama-server \
            --server-version "${{ env.LLAMA_CPP_TAG }}" \
            --model-name "${{ env.MODEL_FILE }}" \
            --model-repo "${{ env.MODEL_REPO }}" \
            --output bench-results/ttft-results.json \
            --ctx "${{ env.CTX_SIZE }}" \
            --threads "${{ env.THREADS }}" \
            --max-tokens "${{ env.MAX_TOKENS }}"

      - name: Add model file size to results
        run: |
          export MODEL_FILE="${{ env.MODEL_FILE }}"
          python3 - <<'PY'
          import json
          import os

          size = os.path.getsize(f"models/{os.environ['MODEL_FILE']}")
          size_gb = round(size / 1073741824, 2)
          for name in ("configA", "configB"):
              path = f"bench-results/{name}.json"
              with open(path) as fh:
                  data = json.load(fh)
              data["file_size_gb"] = size_gb
              with open(path, "w") as fh:
                  json.dump(data, fh, indent=2)
          with open("bench-results/ttft-results.json") as fh:
              data = json.load(fh)
          data["model"]["file_size_gb"] = size_gb
          with open("bench-results/ttft-results.json", "w") as fh:
              json.dump(data, fh, indent=2)
          print(f"file_size_gb={size_gb}")
          PY

      - name: Upload raw artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results/

  report:
    runs-on: ubuntu-latest
    needs: [bench]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download raw results
        uses: actions/download-artifact@v4
        with:
          name: bench-results
          path: all-results/

      - name: Render report
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_NUM="${GITHUB_RUN_NUMBER}"
          python3 benchmarks/adtc/scripts/render_report.py \
            "$RUN_NUM" "$SHORT_SHA" "all-results/" \
            "benchmarks/adtc/results-${RUN_NUM}-${SHORT_SHA}.md"
          cp "benchmarks/adtc/results-${RUN_NUM}-${SHORT_SHA}.md" \
            benchmarks/adtc/LATEST.md

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/adtc/
          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_NUM="${GITHUB_RUN_NUMBER}"
          git commit -m "Add ADTC benchmark report (run ${RUN_NUM}) [skip ci]" || echo "nothing to commit"
          git push
